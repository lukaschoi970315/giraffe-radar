name: Auto Sync Naver Blog Posts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real-time Naver Blog PostTitleListAsync
        run: |
          python3 - << 'PYEOF'
          import urllib.request, urllib.parse, json, html, os

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://blog.naver.com/PostList.naver?blogId=giraffemoneyroad"
          }
          all_posts = []
          seen = set()
          total_count = 0
          bs_single = chr(92) + chr(39)

          for page in range(1, 5):
              url = f"https://blog.naver.com/PostTitleListAsync.naver?blogId=giraffemoneyroad&viewdate=&currentPage={page}&categoryNo=&parentCategoryNo=&countPerPage=30"
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=10).read().decode("utf-8", "ignore")
                  data = json.loads(raw.replace(bs_single, chr(39)), strict=False)
                  if data.get("totalCount"):
                      total_count = int(data["totalCount"])
                  for p in data.get("postList", []):
                      log_no = str(p.get("logNo", "")).strip()
                      if not log_no or log_no in seen:
                          continue
                      seen.add(log_no)
                      title = html.unescape(urllib.parse.unquote_plus(p.get("title", ""))).strip()
                      add_date = str(p.get("addDate", "")).strip()
                      all_posts.append({
                          "logNo": log_no,
                          "date": add_date,
                          "title": title,
                          "url": f"https://blog.naver.com/giraffemoneyroad/{log_no}"
                      })
              except Exception as e:
                  print("Page fetch warning:", page, e)

          if all_posts:
              prev_log_nos = []
              if os.path.exists("live_posts.json"):
                  try:
                      prev = json.load(open("live_posts.json", "r", encoding="utf-8"))
                      prev_log_nos = [str(x.get("logNo", "")) for x in prev.get("posts", [])]
                  except Exception:
                      pass
              cur_log_nos = [str(x.get("logNo", "")) for x in all_posts]
              if cur_log_nos != prev_log_nos:
                  with open("live_posts.json", "w", encoding="utf-8") as f:
                      json.dump({
                          "ok": True,
                          "totalCount": max(total_count, len(all_posts)),
                          "posts": all_posts
                      }, f, ensure_ascii=False, indent=2)
                  print("New blog posts detected! Updated live_posts.json:", len(all_posts))
              else:
                  print("No new blog posts (still", len(all_posts), "posts). Skipping commit.")
          PYEOF
      - name: Commit and push if new post detected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet live_posts.json; then
            git add live_posts.json
            git commit -m "Auto-sync latest published Naver blog posts"
            git push
          fi
